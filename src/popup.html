<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ByeBlock</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon-48.png" alt="" width="32" height="32" />
      <div>
        <h1>ByeBlock</h1>
        <p class="sub">SoundCloud geoblock remover</p>
      </div>
      <label class="switch" title="Enable or disable ByeBlock">
        <input type="checkbox" id="enabled" />
        <span></span>
      </label>
    </header>

    <form id="form">
      <label for="proxyUrl">Proxy server</label>
      <input id="proxyUrl" type="url" placeholder="https://byeblock.example.com" autocomplete="off" spellcheck="false" />

      <label for="token">Access token <span class="muted">(optional)</span></label>
      <input id="token" type="password" placeholder="Only if your server sets ACCESS_TOKEN" autocomplete="off" />

      <div class="actions">
        <button type="button" id="test" class="secondary">Test</button>
        <button type="submit" id="save">Save</button>
      </div>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <footer>
      Run your own proxy in the region you want to listen from.
      <a href="https://github.com/Kuzuw/byeblock#1-run-a-proxy-server" target="_blank" rel="noopener">How?</a>
    </footer>

    <script src="core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
